[tool.poetry]
name = "cst-results-analysis"
version = "0.1.0"
description = "CST Studio electromagnetic field data analysis and S-parameter visualization"
authors = ["Vlad Podolsy"]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.0"
matplotlib = "^3.9"
h5py = "^3.11"
scikit-rf = "^1.5"
Pillow = "^11.0"
imageio = "^2.36"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29"

[tool.poetry.group.optional.dependencies]
cupy-cuda12x = { version = "^13.0", optional = true }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
